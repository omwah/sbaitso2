[project]
name = "sbaitso2"
version = "0.1.0"
description = "DR. SBAITSO/2 — a modern chatbot with a 1991 DOS soul"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "rich>=13.7",
    "websockets>=17.1",
]

[project.scripts]
sbaitso = "sbaitso.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sbaitso"]
