<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DR. SBAITSO/2</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <link rel="stylesheet" href="/assets/crt.css">
</head>
<body>
  <div id="crt">
    <div id="screen">
      <div id="terminal"></div>
      <button id="controls-toggle" type="button" aria-controls="control-drawer" aria-expanded="false">CTRL</button>
      <aside id="control-drawer" hidden aria-hidden="true" aria-label="Terminal controls">
        <button id="controls-close" type="button" aria-label="Close controls">X</button>
        <div class="control-title">SYSTEM CONTROLS</div>
        <div class="sound-control">
          <span>SOUND</span>
          <button id="voice-toggle" class="sound-toggle" type="button" role="switch" aria-checked="true" aria-label="Disable speech synthesis"><span class="toggle-knob"></span></button>
        </div>
        <div class="sound-control">
          <span>KEYCLICK</span>
          <button id="keyclick-toggle" class="sound-toggle" type="button" role="switch" aria-checked="false" aria-label="Enable keyclick"><span class="toggle-knob"></span></button>
        </div>
        <div class="voice-controls">
          <label for="preset-control">VOICE PRESET</label>
          <select id="preset-control" aria-label="S.A.M. voice preset">
            <option value="sam">SAM</option><option value="elf">ELF</option>
            <option value="robot">LITTLE ROBOT</option><option value="stuffy">STUFFY GUY</option>
            <option value="lady">LITTLE OLD LADY</option><option value="alien">EXTRA-TERRESTRIAL</option>
          </select>
          <label for="speed-control">SPEED <output id="speed-value">72</output></label>
          <input id="speed-control" type="range" min="0" max="255" step="1" value="72" aria-label="Voice speed">
          <label for="pitch-control">PITCH <output id="pitch-value">64</output></label>
          <input id="pitch-control" type="range" min="0" max="255" step="1" value="64" aria-label="Voice pitch">
          <label for="mouth-control">MOUTH <output id="mouth-value">128</output></label>
          <input id="mouth-control" type="range" min="0" max="255" step="1" value="128" aria-label="Voice mouth">
          <label for="throat-control">THROAT <output id="throat-value">128</output></label>
          <input id="throat-control" type="range" min="0" max="255" step="1" value="128" aria-label="Voice throat">
        </div>
      </aside>
      <div id="scanlines"></div>
      <div id="vignette"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="/assets/vendor/samjs.min.js"></script>
  <script src="/assets/sbaitso.js"></script>
</body>
</html>
